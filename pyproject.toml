[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rein"
version = "0.1.0"
description = "Framework-agnostic middleware for AI agent safety and observability. Agent = Model + Harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "rein team" },
]
keywords = [
    "agent",
    "llm",
    "guardrails",
    "middleware",
    "safety",
    "observability",
    "replay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "sqlglot>=27.0",
    "typer>=0.12",
    "rich>=13.0",
    "Jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/SeoYeongBaek/rein"
Repository = "https://github.com/SeoYeongBaek/rein"
Issues = "https://github.com/SeoYeongBaek/rein/issues"

[project.optional-dependencies]
# litellm은 프로바이더 비종속 LLM 호출을 위한 선택 의존성 (CLAUDE.md §10)
llm = ["litellm>=1.0"]
# demo/ab_demo(#74/#75)가 §3 빌트인 어댑터 자동 감지/observe_model 배선을
# 실제로 dogfooding하려면 raw openai SDK가 필요하다(litellm은 client
# 객체가 없어 이 경로를 우회한다).
demo = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # .pre-commit-config.yaml의 ruff-pre-commit rev와 정확히 같은 버전으로
    # 고정한다. 이전엔 ruff>=0.6(무제한)이라 CI(pip install)가 pre-commit이
    # 검증한 버전보다 새 ruff를 받아, 새 버전이 포맷 기본 동작을 바꿀 때마다
    # (예: 0.16.0부터 마크다운 내 파이썬 코드블록도 포맷 대상에 포함) CI만
    # 실패하는 드리프트가 반복됐다(이슈 #69 대응 커밋 223d0b4가 pre-commit만
    # 고쳤던 것의 재발). 버전을 하나로 고정해 이 드리프트 자체를 없앤다.
    "ruff==0.15.22",
    "pre-commit>=3.0",
    # 이슈 #15: register_tool을 외부 프레임워크(LangChain)에 붙여도
    # 충돌 없이 동작하는지 검증하기 위한 최소 통합 의존성.
    "langchain-core>=0.3",
]

[project.scripts]
rein = "rein.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rein"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/rein"]
